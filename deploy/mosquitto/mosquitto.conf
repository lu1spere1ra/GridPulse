# Local development broker. Anonymous access is acceptable here only because
# the broker is reachable from the compose network and a host port in the dev range.
listener 1883
allow_anonymous true
persistence false
# Upper bound for messages queued per client while it applies backpressure (QoS 1).
max_queued_messages 200000
max_inflight_messages 1000
log_type error
log_type warning
