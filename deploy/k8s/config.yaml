# Shared configuration. The database secret below is a development placeholder: in a real cluster
# create it out of band (sealed-secrets, External Secrets Operator, or `kubectl create secret`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gridpulse-config
  namespace: gridpulse
data:
  Mqtt__Host: mosquitto
  Mqtt__Port: "1883"
---
apiVersion: v1
kind: Secret
metadata:
  name: gridpulse-db
  namespace: gridpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  ConnectionStrings__GridPulse: Host=timescaledb;Port=5432;Database=gridpulse;Username=gridpulse;Password=change-me
