name: gridpulse

# Every host port is in 5300-5399 (see docs/PLAN.md, section 6).
# Scale the fleet with:  GRIDPULSE_METERS=5000 docker compose up

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://prometheus:9090/api/v1/otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "5000"

x-dotnet-env: &dotnet-env
  <<: *otel-env
  ConnectionStrings__GridPulse: Host=db;Port=5432;Database=gridpulse;Username=gridpulse;Password=gridpulse
  Mqtt__Host: mqtt
  Mqtt__Port: "1883"

services:
  db:
    image: timescale/timescaledb:2.31.0-pg17
    environment:
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: gridpulse
      POSTGRES_DB: gridpulse
    ports: ["5310:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse -d gridpulse"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports: ["5320:1883"]
    volumes: [./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build: { context: ., args: { PROJECT: GridPulse.Migrator } }
    image: gridpulse/migrator:local
    environment: *dotnet-env
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., args: { PROJECT: GridPulse.Api } }
    image: gridpulse/api:local
    environment: *dotnet-env
    ports: ["5301:8080"]
    depends_on:
      migrator: { condition: service_completed_successfully }
      mqtt: { condition: service_healthy }

  ingestion:
    build: { context: ., args: { PROJECT: GridPulse.Ingestion } }
    image: gridpulse/ingestion:local
    environment:
      <<: *dotnet-env
      Email__Host: mailpit
      Email__Port: "1025"
    depends_on:
      migrator: { condition: service_completed_successfully }
      mqtt: { condition: service_healthy }
      mailpit: { condition: service_started }

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["5340:8025"] # web UI; SMTP (1025) stays on the compose network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports: ["5350:10000"] # blob endpoint, e.g. for Azure Storage Explorer

  reports:
    build: { context: ., dockerfile: src/GridPulse.Reports/Dockerfile }
    image: gridpulse/reports:local
    environment:
      AzureWebJobsStorage: &azurite DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      ReportStorage__ConnectionString: *azurite
      ConnectionStrings__GridPulse: Host=db;Port=5432;Database=gridpulse;Username=gridpulse;Password=gridpulse
      AZURE_FUNCTIONS_ENVIRONMENT: Development
      # Development-only function keys from a file (see deploy/functions/README.md).
      AzureWebJobsSecretStorageType: files
    volumes: [./deploy/functions/secrets:/azure-functions-host/Secrets:ro]
    ports: ["5360:80"]
    depends_on:
      azurite: { condition: service_started }
      migrator: { condition: service_completed_successfully }

  simulator:
    build: { context: ., args: { PROJECT: GridPulse.Simulator } }
    image: gridpulse/simulator:local
    environment:
      <<: *otel-env
      Mqtt__Host: mqtt
      Mqtt__Port: "1883"
      Simulator__ApiBaseUrl: http://api:8080/
      Simulator__MeterCount: ${GRIDPULSE_METERS:-500}
    depends_on: [api, ingestion]

  web:
    build: { context: ., args: { PROJECT: GridPulse.Web } }
    image: gridpulse/web:local
    environment:
      <<: *otel-env
      Api__BaseUrl: http://api:8080/
    ports: ["5300:8080"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=3d
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["5330:9090"]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gridpulse.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["5331:3000"]
    depends_on: [prometheus]

volumes:
  db-data:
